config:
  default: true
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD024:
    siblings_only: true
  MD033:
    allowed_elements: [br, details, summary, sub, sup]
  MD041: true
  MD046:
    style: fenced
globs:
  - "**/*.md"
ignores:
  - "node_modules"
  - "CHANGELOG.md"
