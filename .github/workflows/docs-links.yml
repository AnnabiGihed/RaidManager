name: docs-links

# External links change without any commit, so they are checked weekly rather than on every pull request.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: [self-hosted, linux, pc-personal]
    steps:
      - uses: actions/checkout@v7
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 2 docs README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
