name: auto-merge

# pull_request_target runs main's copy of this workflow, so a pull request cannot change what uses the owner's token.
on:
  pull_request_target:
    branches: [main]
    types: [ready_for_review]

permissions: {}

jobs:
  enable-auto-merge:
    # Forks never receive the token. This job must never check out or run pull-request code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The owner's token queues the merge, so the resulting main push still starts documentation publishing.
      - name: Queue a squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
