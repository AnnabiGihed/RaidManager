name: project-hierarchy

on:
  issues:
    # A reopened or relabeled child can invalidate a completed parent, so every change re-checks the ancestors.
    types: [closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Runs one at a time, so two events never reopen the same parent twice.
concurrency:
  group: project-hierarchy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  hierarchy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reopen incomplete epics and stories and their ancestors
        run: |
          if [ "${{ github.event_name }}" = issues ]; then
            python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY" --issue "${{ github.event.issue.number }}"
          else
            python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY"
          fi
