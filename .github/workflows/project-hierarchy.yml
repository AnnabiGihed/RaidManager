name: project-hierarchy

on:
  issues:
    # Creating, closing or reopening an issue starts one run each; GitHub sends one event per label, milestone and edit,
    # so listening to those started up to four runs for one new issue (owner decision on #582). Each run also checks
    # every issue changed in the last 30 minutes, and the audit below catches a later edit, relabel or milestone change.
    types: [opened, closed, reopened]
  milestone:
    # Closing a release milestone is checked against its release record at once.
    types: [closed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Issue runs go one at a time, so two events never reopen the same parent twice. The audit has its own queue, so a
# waiting audit is never replaced by an issue run (owner decision on #582).
concurrency:
  group: project-hierarchy-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'audit' || 'events' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  hierarchy:
    runs-on: [self-hosted, linux, pc-personal]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ensure the rule labels exist
        run: |
          gh label create needs-parent --repo "$GITHUB_REPOSITORY" --color d93f0b --force             --description "Standalone or misplaced: one type label and a parent of the allowed type (work management spec)"
          gh label create ui --repo "$GITHUB_REPOSITORY" --color 1d76db --force             --description "Changes what users see; must link or show its Penpot mockup (ADR-0017)"
          gh label create needs-mockup --repo "$GITHUB_REPOSITORY" --color fbca04 --force             --description "UI work without a linked or shown mockup (ADR-0017)"
          gh label create needs-contract --repo "$GITHUB_REPOSITORY" --color c5def5 --force \
            --description "Missing part of the issue contract (work management specification section 4)"
          gh label create dependency-problem --repo "$GITHUB_REPOSITORY" --color b60205 --force \
            --description "Dependency cycle or canceled prerequisite (work management specification section 10)"
      - name: Check parents and completion, and the ancestors of a changed issue
        run: |
          if [ "${{ github.event_name }}" = milestone ]; then
            python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY" --releases
          elif [ "${{ github.event_name }}" = issues ]; then
            python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY" --issue "${{ github.event.issue.number }}"
          else
            python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY"
          fi
