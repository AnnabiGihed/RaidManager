name: checks

# The checks of a commit: `changes` reads which files the pull request changes, once, and each check then runs only
# when the files it reads changed (#582). A skipped job counts as passed for a required check, so a check is skipped
# only when nothing it reads can have changed (scripts/check_scope.py). The description checks run in review.yml, so
# an edited description doesn't run these again.
# After a merge it doesn't run again: main must be up to date to merge, so the pull request's run tested the merged
# code (#586). It can still be started by hand on any branch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pull request's newer commit replaces the run of the older one, whose result no check reads anymore (#579). Runs on
# main are never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Avalonia's build package sends anonymous build telemetry unless this is set; RaidManager opts out (#520).
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  changes:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    permissions:
      contents: read
      # Lists the files the pull request changes.
      pull-requests: read
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      build-test: ${{ steps.scope.outputs.build-test }}
      companion: ${{ steps.scope.outputs.companion }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Choose the checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check_scope.py >> "$GITHUB_OUTPUT"

  # Documentation, skills and scripts: their checks, the wiki and the site build.
  docs:
    needs: changes
    # Skipped with `changes` for a fork's pull request too (ADR-0034).
    if: needs.changes.outputs.docs == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, pc-personal]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Documentation tools
        # Wheels only: a source package could run its setup script during installation.
        run: |
          python -m pip install --quiet --only-binary :all: pyspellchecker==0.9.0 mypy==1.11.2
      - name: Documentation validator tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Script type check
        run: python -m mypy
      - name: Root documents and diagram sources
        run: python scripts/validate_docs.py
      - name: Spelling (US English and the project word list)
        run: python scripts/spell_check.py
      - name: GitHub Wiki build
        run: python scripts/build_wiki.py
      - name: Mirrored skills
        run: diff -qr .agents/skills .claude/skills
      - name: Markdown lint
        run: npx --yes --ignore-scripts markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"
      - name: Prose lint
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.23.0
          files: '["README.md","CHANGELOG.md","CONTRIBUTING.md","SECURITY.md","docs"]'
          filter_mode: nofilter
          fail_level: error
          # Without this, reviewdog only annotates Vale's errors and the check still passes.
          fail_on_error: true
          sync: false
      - name: Internal link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-verbatim --no-progress docs README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
      - name: OpenAPI contract lint
        shell: bash
        run: |
          contracts=()
          for contract in openapi.yaml openapi.json docs/api/openapi.yaml docs/api/openapi.json; do
            if test -f "$contract"; then contracts+=("$contract"); fi
          done
          if ((${#contracts[@]})); then
            npx --yes --ignore-scripts @redocly/cli@2.55.0 lint "${contracts[@]}"
          fi
      - name: Build documentation
        run: |
          python -m pip install --only-binary :all: mkdocs-material==9.6.22
          python -m mkdocs build --strict --site-dir site

  # Format, build, every test, and the coverage gate (ADR-0015).
  build-test:
    needs: changes
    # Skipped with `changes` for a fork's pull request too (ADR-0034).
    if: needs.changes.outputs.build-test == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, pc-personal]
    permissions:
      contents: read
      # Only for the coverage comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        env:
          PIVOT_PACKAGES_USER: ${{ secrets.PIVOT_PACKAGES_USER }}
          PIVOT_PACKAGES_TOKEN: ${{ secrets.PIVOT_PACKAGES_TOKEN }}
        run: dotnet restore RaidManager.sln
      - name: Format
        run: dotnet format RaidManager.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build RaidManager.sln --no-restore --configuration Release
      - name: Test
        run: >-
          dotnet test RaidManager.sln --no-build --configuration Release
          --settings coverage.runsettings --results-directory TestResults
      # The gate is measured here and enforced in the last step, so the summary and comment appear even when it fails.
      - name: Coverage report
        id: coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --quiet --depth=1 origin "$BASE_SHA"
          fi
          if python3 scripts/coverage_gate.py --reports TestResults --base "$BASE_SHA" --summary; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            TestResults/**/coverage.cobertura.xml
            coverage-summary.md
          retention-days: 14
      - name: Coverage comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One comment per pull request, updated on every push.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->"))) | .id' \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@coverage-summary.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file coverage-summary.md
          fi
      - name: Coverage gate
        if: steps.coverage.outputs.passed != 'true'
        run: |
          echo "::error::The coverage gate failed (ADR-0015). See the coverage summary for the uncovered changed lines."
          exit 1

  # The desktop companion as players get it (ADR-0032): one self-contained Windows executable, cross-published from
  # Linux for the dev environment, kept as a workflow artifact.
  companion:
    needs: changes
    # Skipped with `changes` for a fork's pull request too (ADR-0034).
    if: needs.changes.outputs.companion == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, pc-personal]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the companion for dev
        run: >-
          dotnet publish src/Containers/UI/Hosting/RaidManager.Companion/RaidManager.Companion.csproj
          -p:PublishProfile=win-x64 -p:CompanionEnvironment=Dev
      - name: Upload the companion
        uses: actions/upload-artifact@v7
        with:
          name: raidmanager-companion-win-x64-dev
          path: src/Containers/UI/Hosting/RaidManager.Companion/bin/publish/win-x64/
          retention-days: 14

  # SonarCloud's own check follows the quality gate, which passes new code smells and even some vulnerabilities; this
  # job fails the pull request on any open SonarCloud issue or security hotspot to review (ADR-0020). SonarCloud reads
  # every language, so it runs on every pull request.
  sonar:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: SonarCloud findings
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/sonar_gate.py --project AnnabiGihed_RaidManager
          --pull-request "$PR_NUMBER" --commit "$HEAD_SHA" --timeout 900
