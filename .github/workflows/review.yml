name: review

# Pull-request events use pull_request_target and check completions use workflow_run, so main's copy of this workflow
# runs for both and a pull request cannot change them. Reviews re-evaluate the gate. No step runs pull-request code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [ci, docs]
    types: [completed]

permissions: {}

jobs:
  # One job per event: hand new commits back to the operator, act on the operator's sign-off, set the required
  # review-files-viewed status, and merge once everything passes. Waiting for a review is a pending status; the job
  # fails only on an unexpected error.
  review:
    if: >-
      (github.event_name != 'workflow_run' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    # One evaluation per pull request at a time, so the last status posted reflects the latest event.
    concurrency:
      group: review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    env:
      # People who review pull requests. Each needs a REVIEW_TOKEN_<LOGIN> secret: their own read-only token.
      REVIEWERS: AnnabiGihed anthermook
      REVIEW_TOKEN_ANNABIGIHED: ${{ secrets.REVIEW_TOKEN_ANNABIGIHED }}
      REVIEW_TOKEN_ANTHERMOOK: ${{ secrets.REVIEW_TOKEN_ANTHERMOOK || secrets.REVIEW_GATE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # New commits need the operator's review before a peer is asked, so a ready pull request goes back to draft.
      - name: Hand new commits back to the operator
        if: >-
          github.event_name == 'pull_request_target' && github.run_attempt == 1 &&
          !github.event.pull_request.draft && github.event.action != 'ready_for_review'
        run: |
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Returned to draft: @$AUTHOR reviews the new commits, marks every file as viewed, then marks it ready."

      # Marking the draft ready is the operator's sign-off. Backed by viewing every file, it asks the peer to review.
      - name: Act on the operator's sign-off
        if: github.event.action == 'ready_for_review' && github.run_attempt == 1
        run: |
          status=0
          python scripts/verify_review_viewed.py operator > result.txt 2>&1 || status=$?
          cat result.txt
          if [ "$status" -ne 0 ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
            { echo "Returned to draft: @$AUTHOR must mark every changed file as viewed before marking it ready."
              echo; echo '```'; cat result.txt; echo '```'; } > comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            exit 0
          fi
          for reviewer in $REVIEWERS; do
            if [ "${reviewer,,}" != "${AUTHOR,,}" ]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$reviewer"
            fi
          done

      # Pending while a review is outstanding, success when the gate passes, failure only for a problem to fix.
      - name: Set the review status
        id: gate
        run: |
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          code=0
          python scripts/verify_review_viewed.py gate > result.txt 2>&1 || code=$?
          cat result.txt
          case "$code" in
            0) state=success ;;
            3) state=pending ;;
            *) state=failure ;;
          esac
          description=$(head -n 1 result.txt | sed -E 's/^[A-Z]+: //' | cut -c 1-140)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state="$state" \
            -f context=review-files-viewed \
            -f description="${description:-Review gate $state}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "review-files-viewed: $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      # Branch protection still decides: GitHub refuses the merge unless every required review and check passes.
      # A merge made with the workflow token starts no push workflows, so the main workflows are started explicitly.
      - name: Merge once everything passes
        if: steps.gate.outputs.state == 'success'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          # GitHub needs a moment to take the new status into account, so the merge is retried for a minute.
          for attempt in $(seq 1 12); do
            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" \
              > merge.txt 2>&1; then
              cat merge.txt
              for workflow in ci.yml docs.yml docs-publish.yml; do
                gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
              done
              exit 0
            fi
            sleep 5
          done
          cat merge.txt
          echo "Not mergeable yet; a required check that finishes later re-runs this job and merges then."
