name: review

# Pull-request events use pull_request_target and check completions use workflow_run, so main's copy of this workflow
# runs for both and a pull request cannot change them. Reviews and review comments re-evaluate the gate. No step runs
# pull-request code, and no personal token is used: reviews, comments and the diff are read with the workflow token.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [ci, docs]
    types: [completed]

permissions: {}

jobs:
  # One job per event: hand new commits back to the operator, act on the operator's sign-off, set the required
  # review-gate status, and merge once everything passes. Waiting for a review is a pending status; the job
  # fails only on an unexpected error.
  review:
    if: >-
      (github.event_name != 'workflow_run' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0] != null)
    runs-on: [self-hosted, linux, pc-personal]
    # One evaluation per pull request at a time, so the last status posted reflects the latest event.
    concurrency:
      group: review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    env:
      # People who review pull requests; the operator's sign-off requests the others.
      REVIEWERS: AnnabiGihed anthermook
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      # The operator: the author, or the owner for Dependabot's updates (owner decision on #460, verify_review.py).
      AUTHOR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'AnnabiGihed' || github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # New commits need the operator's review before a peer is asked, so a ready pull request goes back to draft.
      - name: Hand new commits back to the operator
        if: >-
          github.event_name == 'pull_request_target' && github.run_attempt == 1 &&
          !github.event.pull_request.draft && github.event.action != 'ready_for_review'
        run: |
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Returned to draft: @$AUTHOR reviews the new commits in a review comment, then marks it ready."

      # Marking the draft ready is the operator's sign-off. Backed by their review comment, it asks the peer to review.
      - name: Act on the operator's sign-off
        if: github.event.action == 'ready_for_review' && github.run_attempt == 1
        run: |
          status=0
          python scripts/verify_review.py operator > result.txt 2>&1 || status=$?
          cat result.txt
          if [ "$status" -ne 0 ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
            { echo "Returned to draft: @$AUTHOR must post a meaningful review comment before marking it ready."
              echo; echo '```'; cat result.txt; echo '```'; } > comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            exit 0
          fi
          for reviewer in $REVIEWERS; do
            if [ "${reviewer,,}" != "${AUTHOR,,}" ]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$reviewer"
            fi
          done

      # Pending while a review is outstanding, success when the gate passes, failure only for a problem to fix.
      - name: Set the review status
        id: gate
        run: |
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          code=0
          python scripts/verify_review.py gate > result.txt 2>&1 || code=$?
          cat result.txt
          case "$code" in
            0) state=success ;;
            3) state=pending ;;
            *) state=failure ;;
          esac
          description=$(head -n 1 result.txt | sed -E 's/^[A-Z]+: //' | cut -c 1-140)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state="$state" \
            -f context=review-gate \
            -f description="${description:-Review gate $state}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "review-gate: $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      # Branch protection still decides: GitHub refuses the merge unless every required review and check passes.
      # A merge made with the workflow token triggers no push workflows, no closing keywords and no branch deletion,
      # so the job does all three itself.
      - name: Merge once everything passes
        if: steps.gate.outputs.state == 'success'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          # Review runs of one pull request queue up, and the gate still passes after the merge. Only the run that
          # merged closes the tasks and dispatches the workflows on main, so a later one stops here (#493).
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "MERGED" ]; then
            echo "Already merged by an earlier review run; its tasks and the workflows on main were handled there."
            exit 0
          fi
          # Only standalone closing lines before the first heading are instructions. Examples in the PR body are not.
          # A body saved in the browser has CRLF line endings, so the carriage returns go first (#474).
          linked=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number')
          written=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | tr -d '\r' | sed '/^## /,$d' | grep -iE '^Closes #[0-9]+[[:blank:]]*$' | grep -oE '[0-9]+' || true)
          closes=$(printf '%s\n%s\n' "$linked" "$written" | grep -E '^[0-9]+$' | sort -un || true)
          # GitHub needs a moment to take the new status into account, and it sometimes answers "Merge already in
          # progress" for minutes, so the merge is retried for about five minutes with growing waits.
          merged=false
          for attempt in $(seq 1 15); do
            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
              --match-head-commit "$HEAD_SHA" > merge.txt 2>&1; then
              merged=true
              break
            fi
            echo "Attempt $attempt: $(tr '\n' ' ' < merge.txt)"
            # A merge that GitHub reported as still in progress may have completed in the meantime.
            if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "MERGED" ]; then
              merged=true
              break
            fi
            if [ "$attempt" -le 5 ]; then sleep 5; else sleep 30; fi
          done
          if [ "$merged" = true ]; then
            cat merge.txt
            for issue in $closes; do
              labels=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
              if ! printf '%s\n' "$labels" | grep -Eq '^type:task$'; then
                echo "Skipped #$issue: only tasks close from a pull request (ADR-0025)."
                continue
              fi
              if [ "$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN" ]; then
                gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Completed by #$PR_NUMBER."
              fi
            done
            # deploy-dev.yml deploys the merged main to the dev environment (#389), when a deployed file changed (#491).
            for workflow in ci.yml docs.yml docs-publish.yml; do
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            done
            gh workflow run deploy-dev.yml --repo "$GITHUB_REPOSITORY" --ref main -f trigger=merge
            exit 0
          fi
          # A required check that is still running re-runs this job when it finishes, and that run merges.
          pending=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json bucket \
            --jq '[.[] | select(.bucket == "pending")] | length' || true)
          if [ "${pending:-0}" -gt 0 ]; then
            echo "Not mergeable yet: $pending required check(s) still running. The run they start merges the pull request."
            exit 0
          fi
          # Nothing would re-run this job, so a silent exit would leave a ready pull request unmerged.
          echo "::error::Every gate passed but GitHub refused the merge: $(tr '\n' ' ' < merge.txt). Re-run this job from the Actions tab to merge."
          exit 1
