name: review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

env:
  # People who review pull requests. Each needs a REVIEW_TOKEN_<LOGIN> secret: their own read-only token.
  REVIEWERS: AnnabiGihed anthermook
  PR_NUMBER: ${{ github.event.pull_request.number }}
  AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  # Sets the required review-files-viewed commit status: pending while a review is outstanding, success when the
  # operator reviewed every file and then a peer approved the head commit, failure only for a problem to fix.
  # A status has one current value per commit, so every event simply re-evaluates it.
  review-gate:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    # One evaluation per pull request at a time, so the last status posted reflects the latest event.
    concurrency:
      group: review-gate-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # The gate reads people's review tokens, so it always runs the script from main, never from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Operator review, then peer approval, each after viewing every file
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_TOKEN_ANNABIGIHED: ${{ secrets.REVIEW_TOKEN_ANNABIGIHED }}
          REVIEW_TOKEN_ANTHERMOOK: ${{ secrets.REVIEW_TOKEN_ANTHERMOOK || secrets.REVIEW_GATE_TOKEN }}
        run: |
          code=0
          python scripts/verify_review_viewed.py gate > result.txt 2>&1 || code=$?
          cat result.txt
          case "$code" in
            0) state=success ;;
            3) state=pending ;;
            *) state=failure ;;
          esac
          description=$(head -n 1 result.txt | sed -E 's/^[A-Z]+: //' | cut -c 1-140)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=review-files-viewed \
            -f description="${description:-Review gate $state}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "review-files-viewed: $state"

  # New commits need the operator's review before a peer is asked, so a ready pull request goes back to draft.
  return-to-draft:
    if: >-
      github.event_name == 'pull_request' && github.run_attempt == 1 && !github.event.pull_request.draft &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Return the pull request to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Returned to draft: @$AUTHOR reviews the new commits, marks every file as viewed, then marks it ready."

  # Marking the draft ready is the operator's sign-off. It must be backed by viewing every file; then a peer is asked.
  operator-signoff:
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the operator review and request a peer review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TOKEN_ANNABIGIHED: ${{ secrets.REVIEW_TOKEN_ANNABIGIHED }}
          REVIEW_TOKEN_ANTHERMOOK: ${{ secrets.REVIEW_TOKEN_ANTHERMOOK || secrets.REVIEW_GATE_TOKEN }}
        run: |
          status=0
          python scripts/verify_review_viewed.py operator > result.txt || status=$?
          cat result.txt
          # A skipped file is the operator's to fix, not a job failure: the comment says what to do.
          if [ "$status" -ne 0 ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
            { echo "Returned to draft: @$AUTHOR must mark every changed file as viewed before marking it ready."
              echo; echo '```'; cat result.txt; echo '```'; } > comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            exit 0
          fi
          for reviewer in $REVIEWERS; do
            if [ "${reviewer,,}" != "${AUTHOR,,}" ]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$reviewer"
            fi
          done
