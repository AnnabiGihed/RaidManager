name: review

# Pull-request events use pull_request_target, so main's copy of this workflow always runs and a pull request cannot
# change the gate that checks it. Reviews re-evaluate the gate. No step checks out or runs pull-request code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  # One job per event: hand new commits back to the operator, act on the operator's sign-off, then set the required
  # review-files-viewed status. Waiting for a review is a pending status; the job fails only on an unexpected error.
  review:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One evaluation per pull request at a time, so the last status posted reflects the latest event.
    concurrency:
      group: review-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      # People who review pull requests. Each needs a REVIEW_TOKEN_<LOGIN> secret: their own read-only token.
      REVIEWERS: AnnabiGihed anthermook
      REVIEW_TOKEN_ANNABIGIHED: ${{ secrets.REVIEW_TOKEN_ANNABIGIHED }}
      REVIEW_TOKEN_ANTHERMOOK: ${{ secrets.REVIEW_TOKEN_ANTHERMOOK || secrets.REVIEW_GATE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # New commits need the operator's review before a peer is asked, so a ready pull request goes back to draft.
      - name: Hand new commits back to the operator
        if: >-
          github.event_name == 'pull_request_target' && github.run_attempt == 1 &&
          !github.event.pull_request.draft && github.event.action != 'ready_for_review'
        run: |
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Returned to draft: @$AUTHOR reviews the new commits, marks every file as viewed, then marks it ready."

      # Marking the draft ready is the operator's sign-off. Backed by viewing every file, it asks the peer to review
      # and queues the squash auto-merge with the owner's token, so the main push still publishes the documentation.
      - name: Act on the operator's sign-off
        if: github.event.action == 'ready_for_review' && github.run_attempt == 1
        env:
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          status=0
          python scripts/verify_review_viewed.py operator > result.txt 2>&1 || status=$?
          cat result.txt
          if [ "$status" -ne 0 ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
            { echo "Returned to draft: @$AUTHOR must mark every changed file as viewed before marking it ready."
              echo; echo '```'; cat result.txt; echo '```'; } > comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            exit 0
          fi
          for reviewer in $REVIEWERS; do
            if [ "${reviewer,,}" != "${AUTHOR,,}" ]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$reviewer"
            fi
          done
          GH_TOKEN="$AUTO_MERGE_TOKEN" gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

      # Pending while a review is outstanding, success when the gate passes, failure only for a problem to fix.
      - name: Set the review status
        run: |
          code=0
          python scripts/verify_review_viewed.py gate > result.txt 2>&1 || code=$?
          cat result.txt
          case "$code" in
            0) state=success ;;
            3) state=pending ;;
            *) state=failure ;;
          esac
          description=$(head -n 1 result.txt | sed -E 's/^[A-Z]+: //' | cut -c 1-140)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=review-files-viewed \
            -f description="${description:-Review gate $state}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "review-files-viewed: $state"
