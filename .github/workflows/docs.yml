name: docs

on:
  pull_request:
    branches: [main]
    # `edited` re-checks a changed description. Marking a draft ready changes nothing these checks read, so it no
    # longer starts a run (#579; it came with ADR-0005's self-review rule, superseded by ADR-0009).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # The review workflow starts it on main after merging, because its workflow-token merge triggers no push.
  workflow_dispatch:

# A pull request's newer commit, or a newer description for docs, replaces the run of the older one, whose result no
# check reads anymore (#579). Runs on main are never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    permissions:
      contents: read
      checks: write
      # Finds whether a full run already passed on the same commit (#579).
      actions: read
      # Reads the parent chain of the work items a pull request closes.
      issues: read
      # Lists the files a pull request changes, for the mockup rule.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      # An edited description changes only what the description checks read. When the full checks already passed on
      # the same commit, an edit runs only those; otherwise everything runs. This stays one job, because GitHub counts
      # a skipped required check as passed (#579).
      - name: Choose the checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$ACTION" = edited ]; then
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docs.yml/runs?head_sha=$HEAD_SHA&status=success" \
              --jq '.workflow_runs[].id')
            for run in $runs; do
              built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                --jq '.jobs[] | select(.name == "validate") | .steps[] | select(.name == "Build documentation") | .conclusion')
              if [ "$built" = success ]; then
                full=false
                echo "The full checks passed on $HEAD_SHA in run $run; only the description checks run."
                break
              fi
            done
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Documentation tools
        if: steps.scope.outputs.full == 'true'
        # Wheels only: a source package could run its setup script during installation.
        run: |
          python -m pip install --quiet --only-binary :all: pyspellchecker==0.9.0 mypy==1.11.2
      - name: Documentation validator tests
        if: steps.scope.outputs.full == 'true'
        run: python -m unittest discover -s scripts/tests -v
      - name: Script type check
        if: steps.scope.outputs.full == 'true'
        run: python -m mypy
      - name: Pull-request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/validate_pr.py
      - name: Work item hierarchy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY" --pull-request
      - name: UI mockups
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ui_mockups.py --pull-request
      - name: Root documents and diagram sources
        if: steps.scope.outputs.full == 'true'
        run: python scripts/validate_docs.py
      - name: Spelling (US English and the project word list)
        if: steps.scope.outputs.full == 'true'
        run: python scripts/spell_check.py
      - name: GitHub Wiki build
        if: steps.scope.outputs.full == 'true'
        run: python scripts/build_wiki.py
      - name: Mirrored skills
        if: steps.scope.outputs.full == 'true'
        run: diff -qr .agents/skills .claude/skills
      - name: Markdown lint
        if: steps.scope.outputs.full == 'true'
        run: npx --yes --ignore-scripts markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"
      - name: Prose lint
        if: steps.scope.outputs.full == 'true'
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.23.0
          files: '["README.md","CHANGELOG.md","CONTRIBUTING.md","SECURITY.md","docs"]'
          filter_mode: nofilter
          fail_level: error
          # Without this, reviewdog only annotates Vale's errors and the check still passes.
          fail_on_error: true
          sync: false
      - name: Internal link check
        if: steps.scope.outputs.full == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-verbatim --no-progress docs README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
      - name: OpenAPI contract lint
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          contracts=()
          for contract in openapi.yaml openapi.json docs/api/openapi.yaml docs/api/openapi.json; do
            if test -f "$contract"; then contracts+=("$contract"); fi
          done
          if ((${#contracts[@]})); then
            npx --yes --ignore-scripts @redocly/cli@2.55.0 lint "${contracts[@]}"
          fi
      - name: Build documentation
        if: steps.scope.outputs.full == 'true'
        run: |
          python -m pip install --only-binary :all: mkdocs-material==9.6.22
          python -m mkdocs build --strict --site-dir site
