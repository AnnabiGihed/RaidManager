name: docs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  # The review workflow starts it on main after merging, because its workflow-token merge triggers no push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      # Reads the parent chain of the work items a pull request closes.
      issues: read
      # Lists the files a pull request changes, for the mockup rule.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Documentation tools
        # Wheels only: a source package could run its setup script during installation.
        run: |
          python -m pip install --quiet --only-binary :all: pyspellchecker==0.9.0 mypy==1.11.2
      - name: Documentation validator tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Script type check
        run: python -m mypy
      - name: Pull-request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/validate_pr.py
      - name: Work item hierarchy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY" --pull-request
      - name: UI mockups
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ui_mockups.py --pull-request
      - name: Root documents and diagram sources
        run: python scripts/validate_docs.py
      - name: Spelling (US English and the project word list)
        run: python scripts/spell_check.py
      - name: GitHub Wiki build
        run: python scripts/build_wiki.py
      - name: Mirrored skills
        run: diff -qr .agents/skills .claude/skills
      - name: Markdown lint
        run: npx --yes --ignore-scripts markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"
      - name: Prose lint
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.23.0
          files: '["README.md","CHANGELOG.md","CONTRIBUTING.md","SECURITY.md","docs"]'
          filter_mode: nofilter
          fail_level: error
          # Without this, reviewdog only annotates Vale's errors and the check still passes.
          fail_on_error: true
          sync: false
      - name: Internal link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-verbatim --no-progress docs README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
      - name: OpenAPI contract lint
        shell: bash
        run: |
          contracts=()
          for contract in openapi.yaml openapi.json docs/api/openapi.yaml docs/api/openapi.json; do
            if test -f "$contract"; then contracts+=("$contract"); fi
          done
          if ((${#contracts[@]})); then
            npx --yes --ignore-scripts @redocly/cli@2.55.0 lint "${contracts[@]}"
          fi
      - name: Build documentation
        run: |
          python -m pip install --only-binary :all: mkdocs-material==9.6.22
          python -m mkdocs build --strict --site-dir site
