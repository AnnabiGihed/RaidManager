name: docs-publish

# Publishing runs only on main, in its own workflow, so pull requests never list a skipped deploy job.
# Content reaching main already passed the docs validate check on its pull request. The review workflow starts it
# after merging, because its workflow-token merge triggers no push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build documentation
        run: |
          python -m pip install --only-binary :all: mkdocs-material==9.6.22
          python -m mkdocs build --strict --site-dir site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4

  # The wiki is a generated mirror of docs/ (ADR-0014): every run replaces its pages, so edits made there are lost.
  wiki:
    runs-on: ubuntu-latest
    concurrency:
      group: github-wiki
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the wiki pages
        run: python scripts/build_wiki.py --write --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Publish the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wiki="$RUNNER_TEMP/wiki"
          if ! git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki"; then
            echo "::error::The wiki repository doesn't exist yet. Save any first page in the Wiki tab once, then rerun this workflow (ADR-0014)."
            exit 1
          fi
          find "$wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/site/wiki/." "$wiki/"
          cd "$wiki"
          git add --all
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"             commit --quiet -m "Publish docs from ${GITHUB_SHA::7}"
          git push --quiet origin HEAD
