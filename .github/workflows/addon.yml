name: addon

# Lints, formats and tests the WoW 3.3.5a addon with Lua 5.1 (ADR-0031, #383).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A pull request's newer commit, or a newer description for docs, replaces the run of the older one, whose result no
# check reads anymore (#579). Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lua:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Built here instead of with leafo/gh-actions-lua, which runs sudo apt-get for readline, refused on the
      # self-hosted runners (ADR-0034). Readline only serves the interactive shell; dynamic loading stays for the C
      # modules busted needs. The LuaRocks step below finds this build in .lua, where it looks by default.
      - name: Build Lua 5.1.5
        env:
          LUA_SHA256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/lua.tar.gz" https://www.lua.org/ftp/lua-5.1.5.tar.gz
          echo "$LUA_SHA256  $RUNNER_TEMP/lua.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/lua.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.1.5/src" all MYCFLAGS="-DLUA_USE_POSIX -DLUA_USE_DLOPEN" MYLIBS="-Wl,-E -ldl"
          make -C "$RUNNER_TEMP/lua-5.1.5" install INSTALL_TOP="$PWD/.lua"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
      - name: Install busted and luacheck
        run: |
          luarocks install busted 2.2.0-1
          luarocks install luacheck 1.2.0-1
      - name: Lint
        run: luacheck src/Addon test/Addon
      - name: Format
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ github.token }}
          version: v2.5.2
          args: --check src/Addon test/Addon
      - name: Test
        run: busted test/Addon
