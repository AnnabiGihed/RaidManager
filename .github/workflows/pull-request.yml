name: pull-request

# Checks what the pull request itself says: its description, the work items it closes and the mockup rule. They read
# the description, so an edit runs them again; they take seconds, and the other checks don't re-run on an edit (#582).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# A newer commit or description replaces the run of the older one, whose result no check reads anymore (#579).
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  description:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    permissions:
      contents: read
      # Reads the parent chain of the work items a pull request closes.
      issues: read
      # Lists the files a pull request changes, for the mockup rule.
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pull-request description
        run: python scripts/validate_pr.py
      - name: Work item hierarchy
        run: python scripts/project_hierarchy.py --repository "$GITHUB_REPOSITORY" --pull-request
      - name: UI mockups
        run: python scripts/ui_mockups.py --pull-request
