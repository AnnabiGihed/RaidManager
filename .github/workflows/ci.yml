name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The review workflow starts it on main after merging, because its workflow-token merge triggers no push.
  workflow_dispatch:

# A pull request's newer commit, or a newer description for docs, replaces the run of the older one, whose result no
# check reads anymore (#579). Runs on main are never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Avalonia's build package sends anonymous build telemetry unless this is set; RaidManager opts out (#520).
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build-test:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    permissions:
      contents: read
      # Only for the coverage comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        env:
          PIVOT_PACKAGES_USER: ${{ secrets.PIVOT_PACKAGES_USER }}
          PIVOT_PACKAGES_TOKEN: ${{ secrets.PIVOT_PACKAGES_TOKEN }}
        run: dotnet restore RaidManager.sln
      - name: Format
        run: dotnet format RaidManager.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build RaidManager.sln --no-restore --configuration Release
      - name: Test
        run: >-
          dotnet test RaidManager.sln --no-build --configuration Release
          --settings coverage.runsettings --results-directory TestResults
      # The gate is measured here and enforced in the last step, so the summary and comment appear even when it fails.
      - name: Coverage report
        id: coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --quiet --depth=1 origin "$BASE_SHA"
          fi
          if python3 scripts/coverage_gate.py --reports TestResults --base "$BASE_SHA" --summary; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            TestResults/**/coverage.cobertura.xml
            coverage-summary.md
          retention-days: 14
      - name: Coverage comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One comment per pull request, updated on every push.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->"))) | .id' \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@coverage-summary.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file coverage-summary.md
          fi
      - name: Coverage gate
        if: steps.coverage.outputs.passed != 'true'
        run: |
          echo "::error::The coverage gate failed (ADR-0015). See the coverage summary for the uncovered changed lines."
          exit 1

  # The desktop companion as players get it (ADR-0032): one self-contained Windows executable, cross-published from
  # Linux for the dev environment, kept as a workflow artifact.
  companion:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the companion for dev
        run: >-
          dotnet publish src/Containers/UI/Hosting/RaidManager.Companion/RaidManager.Companion.csproj
          -p:PublishProfile=win-x64 -p:CompanionEnvironment=Dev
      - name: Upload the companion
        uses: actions/upload-artifact@v7
        with:
          name: raidmanager-companion-win-x64-dev
          path: src/Containers/UI/Hosting/RaidManager.Companion/bin/publish/win-x64/
          retention-days: 14

  # SonarCloud's own check follows the quality gate, which passes new code smells and even some vulnerabilities; this
  # job fails the pull request on any open SonarCloud issue or security hotspot to review (ADR-0020).
  sonar:
    # A fork's pull request never runs on the owner's self-hosted runner (ADR-0034).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, pc-personal]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: SonarCloud findings
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/sonar_gate.py --project AnnabiGihed_RaidManager
          --pull-request "$PR_NUMBER" --commit "$HEAD_SHA" --timeout 900
