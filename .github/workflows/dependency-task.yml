name: dependency-task

# Every pull request closes a task (ADR-0025), so each Dependabot update gets one under #461 (owner decisions on #460).
# pull_request_target runs main's copy of this workflow with a token that can write issues and pull requests; no step
# runs pull-request code. The task's sprint is a Project field the token can't write: the agent selects it.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, closed]

permissions: {}

jobs:
  task:
    # Dependabot's branches are in this repository; a fork's pull request never runs this job.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: dependency-task-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create, reuse or cancel the update's task
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: python scripts/dependency_task.py
