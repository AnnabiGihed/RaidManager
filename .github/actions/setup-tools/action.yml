# Installs the GitHub CLI and jq for the job when the self-hosted runner's image lacks them (ADR-0034, owner decision
# on #561). No sudo: the runners refuse it, so the binaries go to the job's temporary folder, pinned and checked
# against their published SHA-256. A tool the image already provides is used as it is.
name: Set up tools
description: Install gh and jq into the job's temporary folder when the runner lacks them.
runs:
  using: composite
  steps:
    - name: Install gh and jq
      shell: bash
      env:
        GH_VERSION: 2.101.0
        GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        JQ_VERSION: 1.8.2
        JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/tools/bin"
        mkdir -p "$bin"
        download() { curl --proto '=https' --tlsv1.2 -sSfL -o "$1" "$2"; }
        if ! command -v gh >/dev/null || ! command -v jq >/dev/null; then
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::setup-tools installs x86_64 binaries; this runner is $(uname -m)."
            exit 1
          fi
        fi
        if ! command -v gh >/dev/null; then
          archive="gh_${GH_VERSION}_linux_amd64"
          download "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" "${archive}/bin/gh"
          mv "$RUNNER_TEMP/${archive}/bin/gh" "$bin/gh"
        fi
        if ! command -v jq >/dev/null; then
          download "$bin/jq" "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          echo "$JQ_SHA256  $bin/jq" | sha256sum --check --quiet
          chmod +x "$bin/jq"
        fi
        echo "$bin" >> "$GITHUB_PATH"
