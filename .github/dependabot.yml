# Dependabot proposes each new release of the GitHub Actions the workflows use, keeping commit-id pins and their
# version comment (#460). The dependency-task workflow gives every such pull request its own task under #461, and the
# owner reviews it as the operator.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Brussels
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
