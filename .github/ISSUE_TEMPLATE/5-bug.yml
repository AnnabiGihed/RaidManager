name: Bug
description: "Something that doesn't work as specified, under a feature."
title: "Bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Every item sits in one chain: Epic → Feature → Story, Improvement or Bug → Task or Spike (ADR-0016). After creating this issue, add it as a sub-issue of its parent; an item without the right parent gets the `needs-parent` label."
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The feature this item belongs to, for example #13."
      placeholder: "#"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What happens, and what should happen instead."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "1. …
2. …"
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: "How we know it's fixed."
    validations:
      required: true
