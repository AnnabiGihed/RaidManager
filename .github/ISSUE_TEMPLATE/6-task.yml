name: Task
description: "One bounded piece of work under a story, improvement, bug or spike."
title: "Task: "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: "Every item sits in one chain: Epic → Feature → User Story, Improvement, Bug or Spike → Task (ADR-0025). Nothing is standalone: after creating this issue, add it as a sub-issue of its parent; an item without the right parent or type gets the `needs-parent` label. Classify by intent first, then scope: a task is bounded work that delivers or verifies part of its parent; its parent says why it exists. A task is the only item a pull request closes, and it has no children. Work that changes what users see must link or show its Penpot mockup (ADR-0017)."
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The story, improvement, bug or spike this task belongs to, for example #13."
      placeholder: "#"
    validations:
      required: true
  - type: dropdown
    id: user-interface
    attributes:
      label: User interface
      description: "Does this change what users see: a website page, companion window, addon frame or Discord message? Yes adds the ui label."
      options:
        - No, nothing users see changes
        - Yes, it changes what users see
    validations:
      required: true
  - type: input
    id: mockup
    attributes:
      label: Mockup
      description: "Required when the answer above is yes: docs/mockups/<screen>.svg or a Penpot share link. You can add it later by editing the issue."
      placeholder: docs/mockups/<screen>.svg
    validations:
      required: false
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: "The single, bounded result of this task."
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: "Concrete criteria for this task, not a copy of the parent's."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: "How the result is checked: tests, commands, evidence."
    validations:
      required: true
