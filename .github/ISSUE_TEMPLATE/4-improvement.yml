name: Improvement
description: "A change that improves existing behaviour or tooling, under a feature."
title: "Improvement: "
labels: ["type:improvement"]
body:
  - type: markdown
    attributes:
      value: "Every item sits in one chain: Epic → Feature → User Story, Improvement, Bug or Spike → Task (ADR-0025). Nothing is standalone: after creating this issue, add it as a sub-issue of its parent; an item without the right parent or type gets the `needs-parent` label. Classify by intent first, then scope: choose an improvement when existing behavior, tooling, documentation or process works as specified but needs to become better; not a bug (it meets its requirements), not a spike (the enhancement is understood). Its children are tasks. Work that changes what users see must link or show its Penpot mockup (ADR-0017)."
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The feature this item belongs to, for example #13."
      placeholder: "#"
    validations:
      required: true
  - type: dropdown
    id: user-interface
    attributes:
      label: User interface
      description: "Does this change what users see: a website page, companion window, addon frame or Discord message? Yes adds the ui label."
      options:
        - No, nothing users see changes
        - Yes, it changes what users see
    validations:
      required: true
  - type: input
    id: mockup
    attributes:
      label: Mockup
      description: "Required when the answer above is yes: docs/mockups/<screen>.svg or a Penpot share link. You can add it later by editing the issue."
      placeholder: docs/mockups/<screen>.svg
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: "What gets better, and for whom."
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: "Verifiable criteria for the improvement."
    validations:
      required: true
