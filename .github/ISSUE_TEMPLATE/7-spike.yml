name: Spike
description: "Time-boxed research under a feature, done through its tasks."
title: "Spike: "
labels: ["type:spike"]
body:
  - type: markdown
    attributes:
      value: "Every item sits in one chain: Epic → Feature → User Story, Improvement, Bug or Spike → Task (ADR-0025). Nothing is standalone: after creating this issue, add it as a sub-issue of its parent; an item without the right parent or type gets the `needs-parent` label. Classify by intent first, then scope: choose a spike when an unknown must be resolved before choosing a direction or implementing; it delivers evidence, findings or a recommendation, not usable behavior. Its children are the tasks that produce the evidence. Work that changes what users see must link or show its Penpot mockup (ADR-0017)."
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The feature this spike belongs to, for example #13."
      placeholder: "#"
    validations:
      required: true
  - type: dropdown
    id: user-interface
    attributes:
      label: User interface
      description: "Does this change what users see: a website page, companion window, addon frame or Discord message? Yes adds the ui label."
      options:
        - No, nothing users see changes
        - Yes, it changes what users see
    validations:
      required: true
  - type: input
    id: mockup
    attributes:
      label: Mockup
      description: "Required when the answer above is yes: docs/mockups/<screen>.svg or a Penpot share link. You can add it later by editing the issue."
      placeholder: docs/mockups/<screen>.svg
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Question
      description: "What must be learned or decided."
    validations:
      required: true
  - type: input
    id: time-box
    attributes:
      label: Time box
      description: "The most time this spike may take, for example 2 days."
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria
      description: "The decision, document or prototype that ends the spike."
    validations:
      required: true
