site_name: RaidManager
site_url: https://annabigihed.github.io/RaidManager/
nav:
  - Home: index.md
  - Product scope: explanation/product.md
  - Architecture: explanation/architecture.md
  - Visual guide:
      - Overview: explanation/visual-guide.md
      - Use cases: explanation/use-cases.md
      - Domain model: explanation/domain-model.md
      - Components: explanation/components.md
      - Account and character sequences: explanation/sequence-identity.md
      - Raid sequences: explanation/sequence-raids.md
      - States and readiness: explanation/state-models.md
  - Diagram maintenance: how-to/diagrams.md
  - Review a pull request: how-to/review-a-pull-request.md
  - Glossary: glossary.md
  - API contracts: reference/api-contracts.md
  - Project automation: reference/project-automation.md
  - Warmane lockout evidence: reference/warmane-lockout-rules.md
  - Decisions:
      - Index: adr/README.md
      - Foundation and authentication: adr/0001-foundation-and-authentication.md
      - Character synchronization: adr/0002-use-desktop-companion-for-character-sync.md
      - Documentation publication: adr/0003-publish-documentation-through-github-pages.md
      - Coverage gate: adr/0015-gate-pull-requests-on-test-coverage.md
theme:
  name: material
markdown_extensions:
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
